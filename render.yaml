services:
  # Express + TypeScript API
  - type: web
    name: escrowmind-api
    runtime: node
    rootDir: apps/api
    region: oregon
    plan: free
    # Keep build tests offline, even if runtime integration secrets are configured.
    buildCommand: npm ci --include=dev && npm run build && env -u PAYPAL_CLIENT_ID -u PAYPAL_CLIENT_SECRET -u PAYPAL_WEBHOOK_ID -u OPENAI_API_KEY -u KERNEL_API_KEY npm test
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: INTERNAL_WORKFLOW_SECRET
        generateValue: true
      - key: AUTO_APPROVE_THRESHOLD
        value: "80"
      - key: MANUAL_REVIEW_THRESHOLD
        value: "50"
      - key: MAX_PROJECT_DAYS
        value: "20"
      - key: MAX_AUTO_APPROVE_AMOUNT
        value: "500.00"
      - key: PLATFORM_FEE_PERCENT
        value: "0"
      - key: MOCK_AI
        value: "true"
      - key: MOCK_KERNEL
        value: "true"
      - key: DEV_SKIP_VERIFY
        value: "false"
      - key: PAYPAL_MERCHANT_ID
        value: U35M58NMFT9N4

  # Next.js 14 frontend
  - type: web
    name: escrowmind-web
    runtime: node
    rootDir: apps/web
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24.22.1"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      # Internal URL for Next.js rewrites (service-name:port over Render's private network).
      - key: INTERNAL_API_URL
        fromService:
          type: web
          name: escrowmind-api
          property: hostport
      # Public API URL used by browser-side fetches; Render supplies the actual hostname.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: escrowmind-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        value: AQif9-RhfeD_ngB8mWZRXMUlnDRDPpI_1Uh1iOlKQImtrY4Ocp80D_d8fujmj4Mz5t_6gR_-Z5XmFh0Z
      - key: NEXT_PUBLIC_PAYPAL_MERCHANT_ID
        value: U35M58NMFT9N4